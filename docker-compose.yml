version: '3.8'

services:
  # ----------------------------------------
  # Frontend: Next.js + React + Tailwind CSS
  # Developer 1
  # ----------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    container_name: ethiopian_upwork_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
    depends_on:
      - backend
    restart: unless-stopped

  # ----------------------------------------
  # Backend: NestJS + TypeScript + Prisma
  # Developer 2
  # ----------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: ethiopian_upwork_backend
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ethiopian_upwork?schema=public
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - postgres
      - redis
      - ai-service
    restart: unless-stopped

  # ----------------------------------------
  # AI Service: Python + FastAPI + Embeddings
  # Developer 3
  # ----------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: ../docker/ai-service/Dockerfile
    container_name: ethiopian_upwork_ai
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ethiopian_upwork?schema=public
    depends_on:
      - postgres
    restart: unless-stopped

  # ----------------------------------------
  # Database: PostgreSQL with pgvector
  # ----------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ethiopian_upwork_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ethiopian_upwork
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  # ----------------------------------------
  # Cache & Realtime: Redis
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ethiopian_upwork_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
